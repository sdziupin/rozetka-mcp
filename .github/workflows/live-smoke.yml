name: Live Rozetka smoke

on:
  push:
    paths:
      - .github/workflows/live-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke -- "iphone"
