name: Live Rozetka smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - tests/live-smoke.ts
      - package.json
      - .github/workflows/live-smoke.yml
  push:
    branches: [devel]
    paths:
      - src/**
      - tests/live-smoke.ts
      - package.json
      - .github/workflows/live-smoke.yml
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke
