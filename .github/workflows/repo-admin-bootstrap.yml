name: Repository admin bootstrap

on:
  push:
    branches: [devel]
    paths:
      - .github/workflows/repo-admin-bootstrap.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Set devel as default branch
        id: default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --method PATCH "repos/$REPO" -f default_branch=devel

      - name: Protect main
        id: protect_main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method PUT "repos/$REPO/branches/main/protection" --input - <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["test", "docker", "release-version", "smoke"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": false,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0,
              "require_last_push_approval": false
            },
            "restrictions": null,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON

      - name: Report outcomes
        env:
          DEFAULT_RESULT: ${{ steps.default_branch.outcome }}
          PROTECTION_RESULT: ${{ steps.protect_main.outcome }}
        run: |
          echo "default_branch=$DEFAULT_RESULT"
          echo "main_protection=$PROTECTION_RESULT"
