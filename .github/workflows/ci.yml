name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

permissions:
  contents: read
  pull-requests: read

jobs:
  main-policy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require merged devel PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          COUNT=$(gh api "repos/$REPO/commits/$SHA/pulls"             --jq '[.[] | select(.base.ref == "main" and .head.ref == "devel" and .merged_at != null)] | length')
          if [ "$COUNT" -lt 1 ]; then
            echo "main accepts release commits only from merged devel -> main pull requests."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: test -f dist/index.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t rozetka-mcp:ci .
